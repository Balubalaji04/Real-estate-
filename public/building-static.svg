  <!-- Windows -->
  <g fill="#FFFFFF" opacity="0.75">
    <rect x="190" y="220" width="10" height="8" transform="skewY(-15)"/>
    <rect x="190" y="250" width="10" height="8" transform="skewY(-15)"/>
    <rect x="190" y="280" width="10" height="8" transform="skewY(-15)"/>
    <rect x="270" y="180" width="12" height="9" transform="skewY(-15)"/>
    <rect x="270" y="220" width="12" height="9" transform="skewY(-15)"/>
    <rect x="270" y="260" width="12" height="9" transform="skewY(-15)"/>
    <rect x="270" y="300" width="12" height="9" transform="skewY(-15)"/>
    <rect x="380" y="210" width="10" height="8" transform="skewY(-15)"/>
    <rect x="380" y="245" width="10" height="8" transform="skewY(-15)"/>
    <rect x="380" y="280" width="10" height="8" transform="skewY(-15)"/>
