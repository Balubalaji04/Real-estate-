<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="640" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F3A"/>
      <stop offset="0.55" stop-color="#123056"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="220" y1="80" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0D78C"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="navyFace" x1="180" y1="100" x2="320" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A3A66"/>
      <stop offset="1" stop-color="#0B1F3A"/>
